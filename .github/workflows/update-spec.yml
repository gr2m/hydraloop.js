name: Update OpenAPI Specs

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update_spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: npm ci

      - name: Fetch latest specs
        run: node scripts/update-spec.js

      - name: Format
        run: npm run lint:fix

      - name: Check for changes
        id: changes
        run: |
          changed=false
          for f in $(git diff --name-only -- spec/); do
            if [[ "$f" == *.json ]]; then
              before=$(git show HEAD:"$f" | jq 'del(.info.version)')
              after=$(jq 'del(.info.version)' "$f")
              if [ "$before" != "$after" ]; then
                changed=true
                break
              fi
            else
              changed=true
              break
            fi
          done
          echo "changed=$changed" >> $GITHUB_OUTPUT

      - name: Open or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/update-spec"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b $BRANCH
          git add spec/
          git commit -m "chore: update OpenAPI specs"
          git push origin $BRANCH --force

          # Open a PR if none is open for this branch yet.
          # On subsequent runs the branch is updated via force-push and the
          # existing PR picks up the new commit automatically.
          if ! gh pr list --head "$BRANCH" --state open --json number --jq '.[].number' | grep -q .; then
            gh pr create \
              --title "chore: update OpenAPI specs" \
              --body "Automated daily update of \`spec/local-api.json\` and \`spec/root-api.json\`. Generated by the [Update OpenAPI Specs](../actions/workflows/update-spec.yml) workflow." \
              --base main \
              --head $BRANCH
          fi
